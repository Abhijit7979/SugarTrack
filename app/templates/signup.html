{% extends "base.html" %} {% block title %}Sign Up - SugarTrack{% endblock %} {%
block content %}
<div class="row justify-content-center">
  <div class="col-md-6 col-lg-5">
    <div class="card shadow">
      <div class="card-header bg-primary text-white text-center">
        <h4 class="card-title mb-0">Create Your SugarTrack Account</h4>
      </div>
      <div class="card-body">
        <form method="POST" action="{{ url_for('auth.signup') }}">
          <div class="mb-3">
            <label for="username" class="form-label">Username</label>
            <input
              type="text"
              class="form-control"
              id="username"
              name="username"
              required
            />
          </div>
          <div class="mb-3">
            <label for="email" class="form-label">Email address</label>
            <input
              type="email"
              class="form-control"
              id="email"
              name="email"
              required
            />
          </div>
          <div class="mb-3">
            <label for="password" class="form-label">Password</label>
            <input
              type="password"
              class="form-control"
              id="password"
              name="password"
              required
            />
          </div>
          <div class="mb-3">
            <label for="daily_goal" class="form-label"
              >Daily Research Goal (minutes)</label
            >
            <input
              type="number"
              class="form-control"
              id="daily_goal"
              name="daily_goal"
              min="10"
              max="600"
              value="120"
              required
            />
            <div class="form-text">
              Set a realistic goal between 10 and 600 minutes per day.
            </div>
          </div>
          <div class="d-grid gap-2">
            <button type="submit" class="btn btn-primary">Sign Up</button>
          </div>
        </form>
        <hr />
        <div class="text-center">
          <p>
            Already have an account?
            <a href="{{ url_for('auth.login') }}">Login</a>
          </p>
        </div>
      </div>
    </div>
  </div>
</div>
{% endblock %}
